
name: Compare EPG Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run source comparison
        run: |
          python compare_epg_sources.py \
            --master epg_us2_locals_att_roku_us_aliases.xml.gz \
            --peacock peacock_raw_supplemental.xml.gz \
            --output epg_source_comparison.csv \
            --summary epg_source_summary.csv

      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epg-source-comparison
          path: |
            *.csv
            *.json
          if-no-files-found: warn
          retention-days: 14
