name: Update MLS PPV EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch provider MLS PPV channel titles
        env:
          XTREAM_SERVER: ${{ secrets.XTREAM_SERVER }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python fetch_xtream_mls.py

      - name: Generate guide
        run: python build_mls_ppv_dynamic.py mls_live_channels.json mls_ppv_live.xml.gz

      - name: Remove private channel data
        run: rm -f mls_live_channels.json

      - name: Publish only the MLS test guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mls_ppv_live.xml.gz
          git diff --cached --quiet || (git commit -m "Refresh MLS PPV guide" && git push)


