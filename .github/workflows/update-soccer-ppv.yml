
name: Update US Soccer PPV EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch provider Soccer PPV channels
        env:
          XTREAM_SERVER: ${{ secrets.XTREAM_SERVER }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python fetch_xtream_soccer_ppv.py

      - name: Generate Soccer PPV guide
        run: python build_soccer_ppv_dynamic.py soccer_ppv_live_channels.json soccer_ppv_live.xml.gz

      - name: Remove temporary provider data
        run: rm -f soccer_ppv_live_channels.json

      - name: Publish Soccer PPV guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soccer_ppv_live.xml.gz
          git diff --cached --quiet || (git commit -m "Refresh Soccer PPV guide" && git push)
